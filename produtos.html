<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Produtos </title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/reset.css">
</head>

<body>
    <header class="inicio">

        <img class="logo" src="./src/img/logo.png" alt="">

        <div class="produtos-cabecalho">

            <div class="lula">
                <img class="creme-um" src="./src/img/creme corporal.png" alt="">

                <img class="creme-dois" src="./src/img/creme2.png" alt="">
            </div>

            <div class="bolsonaro">

                <img class="serum" src="./src/img/sérum.png" alt="">

                <img class="perfume" src="./src/img/body splash.png" alt="">
            </div>

        </div>


    </header>



    <section class="nav">
        <nav class="navegacao">


            <ul class="menu" id="menu">
                <section class="nav">
                    <nav class="navegacao">
                        <ul class="menu" id="menu">

                            <span class="indicador"></span>

                            <li class="produto-aba">
                                <a href="index.html">Início</a>
                            </li>

                            <li class="produto-aba">
                                <a href="sobre.html">Sobre nós</a>
                            </li>

                            <li class="produto-aba">
                                <a href="servicos.html">Serviços</a>
                            </li>

                            <li class="produto-aba">
                                <a href="produtos.html">Produtos</a>
                            </li>

                            <li class="produto-aba">
                                <a href="contato.html">Contato</a>
                            </li>

                            <li class="produto-aba">
                                <a href="agendamento.html" class="agendar">Agendar</a>
                            </li>

                        </ul>
                    </nav>
                </section>
            </ul>

        </nav>
    </section>


    <!-- PRIMEIRO CARROSSEL -->
    <div class="carrossel">

        <button class="controle-concha anterior">
            <img src="./src/img/concha1.png" alt="Voltar">
        </button>

        <div class="produtos-janela">

            <div class="produtos-trilho">

                <img class="produto-item" src="./src/img/creme-agua-e-sal-removebg-preview.png" alt="Água e Sal">

                <img class="produto-item" src="./src/img/creme-aloe-e-sal-removebg-preview.png" alt="Aloe e Sal">

                <img class="produto-item" src="./src/img/creme-brisa-marinha.png" alt="Brisa Marinha">

                <img class="produto-item" src="./src/img/creme-oceano-removebg-preview.png" alt="Oceano">

                <img class="produto-item" src="./src/img/brisa-oceano sf.png" alt="">


            </div>

        </div>

        <button class="controle-concha proximo">
            <img src="./src/img/concha2.png" alt="Avançar">
        </button>

    </div>


    <!-- SEGUNDO CARROSSEL -->
    <div class="carrossel">

        <button class="controle-concha anterior">
            <img src="./src/img/concha1.png" alt="Voltar">
        </button>

        <div class="produtos-janela">

            <div class="produtos-trilho">



                <img class="produto-item" src="./src/img/bodysplash-algas.png" alt="Body Splash">

                <img class="produto-item" src="./src/img/bodysplash-brisadomar.png" alt="Creme corporal">

                <img class="produto-item" src="./src/img/bodysplash-conchadosal.png" alt="Novo produto">

                <img src="./src/img/luarmarinho 1.png" alt="">
            </div>

        </div>

        <button class="controle-concha proximo">
            <img src="./src/img/concha2.png" alt="Avançar">
        </button>

    </div>


    <!-- TERCEIRO CARROSSEL -->
    <div class="carrossel">

        <button class="controle-concha anterior">
            <img src="./src/img/concha1.png" alt="Voltar">
        </button>

        <div class="produtos-janela">

            <div class="produtos-trilho">

                <img class="produto-item" src="./src//img/epumadelimpeza.png" alt="Produto 1">

                <img class="produto-item" src="./src/img/esfoliantenormal.png" alt="Produto 2">

                <img class="produto-item" src="./src/img/produtofacial.png" alt="Produto 3">

                <img src="./src/img/serum.png" alt="">

            </div>

        </div>

        <button class="controle-concha proximo">
            <img src="./src/img/concha2.png" alt="Avançar">
        </button>

    </div>


    <script src="./script.js" defer></script>
</body>

</html>
